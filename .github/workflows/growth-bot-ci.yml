name: growth-bot CI

on:
  push:
    branches: [main]
    paths: ["growth-bot/**", ".github/workflows/growth-bot-ci.yml", "README.md"]
  pull_request:
    paths: ["growth-bot/**", ".github/workflows/growth-bot-ci.yml", "README.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: growth-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: config:check（用示例配置验证加载链路）
        run: |
          cp config/project.example.json config/project.json
          cp config/platforms.example.json config/platforms.json
          cp config/paths.example.json config/paths.json
          npm run config:check
      - name: project:state（对真实 README 做采集验证）
        run: npm run project:state -- --dry-run
      - name: trends:import（用示例热点验证标准化链路）
        run: |
          cp data/trends/source/example.json "data/trends/source/$(date +%F).json"
          npm run trends:import -- --dry-run
      - name: daily:run 首轮（生成阶段完成，发布阶段应被审核门控阻塞）
        run: |
          npm run daily:run
          test ! -d "content/publish-packages/$(date +%F)"
      - name: daily:run 次轮（勾选 Approve 后续跑发布阶段）
        run: |
          sed -i 's/\[ \] Approve/[x] Approve/g' "content/review/$(date +%F).md"
          npm run daily:run
          find "content/publish-packages/$(date +%F)" -type f | head -5
      - name: status（状态总览应显示全链路推进到指标录入）
        run: npm run status
