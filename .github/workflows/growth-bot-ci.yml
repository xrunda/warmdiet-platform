name: growth-bot CI

on:
  push:
    branches: [main]
    paths: ["growth-bot/**", ".github/workflows/growth-bot-ci.yml"]
  pull_request:
    paths: ["growth-bot/**", ".github/workflows/growth-bot-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: growth-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: config:check（用示例配置验证加载链路）
        run: |
          cp config/project.example.json config/project.json
          cp config/platforms.example.json config/platforms.json
          cp config/paths.example.json config/paths.json
          npm run config:check
      - name: project:state（对真实 README 做采集验证）
        run: npm run project:state -- --dry-run
      - name: trends:import（用示例热点验证标准化链路）
        run: |
          cp data/trends/source/example.json "data/trends/source/$(date +%F).json"
          npm run trends:import -- --dry-run
      - name: 完整流水线（项目状态 → 热点 → 日历 → 草稿 → 审核 → 发布包）
        run: |
          npm run project:state
          npm run trends:import
          npm run daily:plan
          npm run drafts:generate
          npm run review:build
          sed -i '0,/\[ \] Approve/s//[x] Approve/' "content/review/$(date +%F).md"
          npm run publish:package
          find "content/publish-packages/$(date +%F)" -type f
