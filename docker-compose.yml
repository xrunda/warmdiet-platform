version: '3.8'

services:
  warmdiet:
    build:
      context: .
      dockerfile: Dockerfile
    image: warmdiet:latest
    container_name: warmdiet
    ports:
      - "4000:4000"
    volumes:
      # 数据库持久化挂载（主机路径:容器路径）
      - ./data:/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/data/warmdiet.db
      - JWT_SECRET=${JWT_SECRET:-warmdiet-jwt-secret-key-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
